spring.application.name=plazoleta

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/plazoleta_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# JPA: las tablas las crea nuestro script (docs/script.sql),
# Hibernate solo revisa que coincidan con las entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# JWT (HU-05): clave para firmar el token y duracion (1 hora en milisegundos)
jwt.secret=PlazoletaClaveSecretaParaFirmarLosTokens2026
jwt.expiration=3600000

# Datos privados (Twilio). Se leen de application-local.properties, un archivo
# que cada persona tiene en su computador y que NO se sube a git.
# "optional" = si el archivo no existe, el proyecto arranca igual.
spring.config.import=optional:file:./application-local.properties

# HU-14: false = el aviso del pedido listo solo sale en la consola.
# Para mandar el SMS real, poner twilio.activo=true en application-local.properties.
twilio.activo=false
